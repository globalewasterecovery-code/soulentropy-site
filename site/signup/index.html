<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d0f" />
    <title>加入社区 · 灵熵 Qi</title>
    <link rel="stylesheet" href="/css/community.css" />
    <style>
      main.auth{width:min(26rem,calc(100% - 3rem));margin:0 auto;min-height:calc(100vh - 4rem);display:grid;align-content:center;gap:1.6rem;padding:2rem 0}
      main.auth h1{margin:0;font-family:Georgia,"Times New Roman","Noto Serif SC",serif;font-weight:400;font-size:2.2rem}
      .switch{font-size:.85rem;color:var(--muted)}
      .switch a{color:var(--text)}
      .step{display:grid;gap:.9rem}
      .hint{font-size:.8rem;color:var(--muted)}
    </style>
  </head>
  <body>
    <nav class="topnav"><div class="topnav-inner">
      <a class="topnav-brand" href="/">灵熵 · Qi</a>
      <div class="topnav-links"><a href="/events/">事件与讨论</a><a href="/resources/">资源交换</a><a href="/contact/">私密联系</a></div>
      <div class="topnav-auth" id="authState">加载中…</div>
    </div></nav>
    <main class="auth">
      <h1>加入社区</h1>
      <p class="lead" style="font-size:.9rem;color:var(--muted);margin:0">只需要昵称和邮箱验证码，不用设密码。</p>

      <div class="community-form" style="gap:.6rem">
        <button type="button" id="oauthGoogle">使用 Google 继续</button>
        <button type="button" id="oauthApple">使用 Apple 继续</button>
        <button type="button" id="oauthFacebook">使用 Facebook 继续</button>
        <p class="msg" id="oauthMsg"></p>
      </div>
      <p class="hint" style="text-align:center">或使用邮箱验证码（备用）</p>

      <form class="community-form step" id="step1Form">
        <div>
          <label class="hint" for="displayName">昵称</label>
          <input id="displayName" name="displayName" type="text" required maxlength="40" />
        </div>
        <div>
          <label class="hint" for="email">邮箱</label>
          <input id="email" name="email" type="email" required />
        </div>
        <button type="submit" id="step1Btn">发送验证码</button>
        <p class="msg" id="step1Msg"></p>
      </form>

      <form class="community-form step" id="step2Form" style="display:none">
        <p class="hint">验证码已发送到邮箱，5-10分钟内有效。</p>
        <div>
          <label class="hint" for="code">6位验证码</label>
          <input id="code" name="code" type="text" inputmode="numeric" required maxlength="8" />
        </div>
        <button type="submit" id="step2Btn">验证并加入</button>
        <p class="msg" id="step2Msg"></p>
      </form>

      <p class="switch">已经有账号？<a href="/login/">去登录</a></p>
    </main>
    <script type="module">
      import { supabase } from '/js/supabase-client.js';
      import { renderAuthState } from '/js/community.js';
      renderAuthState('authState');
      document.getElementById('oauthGoogle').addEventListener('click', () => oauthSignIn('google'));
      document.getElementById('oauthApple').addEventListener('click', () => oauthSignIn('apple'));
      document.getElementById('oauthFacebook').addEventListener('click', () => oauthSignIn('facebook'));
      async function oauthSignIn(provider) {
        const msg = document.getElementById('oauthMsg');
        msg.textContent = ''; msg.className = 'msg';
        const { error } = await supabase.auth.signInWithOAuth({ provider, options: { redirectTo: window.location.origin + '/' } });
        if (error) { msg.textContent = '登录失败：' + error.message; msg.className = 'msg err'; }
      }


      let pendingEmail = '';
      const step1Form = document.getElementById('step1Form');
      const step2Form = document.getElementById('step2Form');
      const step1Msg = document.getElementById('step1Msg');
      const step2Msg = document.getElementById('step2Msg');

      step1Form.addEventListener('submit', async (e) => {
        e.preventDefault();
        step1Msg.textContent = ''; step1Msg.className = 'msg';
        const btn = document.getElementById('step1Btn');
        btn.disabled = true;
        const displayName = document.getElementById('displayName').value.trim();
        const email = document.getElementById('email').value.trim();
        const { error } = await supabase.auth.signInWithOtp({
          email,
          options: { shouldCreateUser: true, data: { display_name: displayName } },
        });
        btn.disabled = false;
        if (error) {
          step1Msg.textContent = '发送失败：' + error.message;
          step1Msg.className = 'msg err';
          return;
        }
        pendingEmail = email;
        step1Msg.textContent = '验证码已发送，请查收邮箱。';
        step1Msg.className = 'msg ok';
        step2Form.style.display = 'grid';
      });

      step2Form.addEventListener('submit', async (e) => {
        e.preventDefault();
        step2Msg.textContent = ''; step2Msg.className = 'msg';
        const btn = document.getElementById('step2Btn');
        btn.disabled = true;
        const code = document.getElementById('code').value.trim();
        const { error } = await supabase.auth.verifyOtp({ email: pendingEmail, token: code, type: 'email' });
        btn.disabled = false;
        if (error) {
          step2Msg.textContent = '验证失败：' + error.message;
          step2Msg.className = 'msg err';
          return;
        }
        step2Msg.textContent = '加入成功！正在跳转…';
        step2Msg.className = 'msg ok';
        setTimeout(() => { window.location.href = '/'; }, 800);
      });
    </script>
  </body>
</html>
