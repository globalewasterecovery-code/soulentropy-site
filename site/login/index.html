<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d0f" />
    <title>登录 · 灵熵 Qi</title>
    <style>
      :root{color-scheme:dark;--bg:#0b0d0f;--text:#f2f0e9;--muted:#aaa99f;--line:rgba(242,240,233,0.16)}
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,rgba(160,175,161,0.09),transparent 36rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
      main{width:min(26rem,calc(100% - 3rem));margin:0 auto;min-height:100vh;display:grid;align-content:center;gap:1.6rem;padding:5rem 0}
      .back{color:var(--muted);text-decoration:none;font-size:.85rem}
      h1{margin:0;font-family:Georgia,"Times New Roman","Noto Serif SC",serif;font-weight:400;font-size:2.2rem}
      form{display:grid;gap:.9rem}
      label{font-size:.85rem;color:var(--muted)}
      input{width:100%;padding:.8rem .9rem;border-radius:.6rem;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);font-size:1rem}
      input:focus{outline:1px solid var(--text)}
      button{padding:.9rem;border-radius:.6rem;border:0;background:var(--text);color:#0b0d0f;font-weight:600;font-size:1rem;cursor:pointer}
      button:disabled{opacity:.5;cursor:default}
      .msg{font-size:.85rem;line-height:1.7;min-height:1.2em}
      .msg.err{color:#ff8a8a}
      .msg.ok{color:#9be29b}
      .switch{font-size:.85rem;color:var(--muted)}
      .switch a{color:var(--text)}
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="/">← 灵熵 · Qi</a>
      <h1>登录</h1>
      <form id="loginForm">
        <div>
          <label for="email">邮箱</label>
          <input id="email" name="email" type="email" required />
        </div>
        <div>
          <label for="password">密码</label>
          <input id="password" name="password" type="password" required />
        </div>
        <button type="submit" id="submitBtn">登录</button>
        <p class="msg" id="msg"></p>
      </form>
      <p class="switch">还没有账号？<a href="/signup/">去注册</a></p>
    </main>
    <script type="module">
      import { supabase } from '/js/supabase-client.js';
      const form = document.getElementById('loginForm');
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submitBtn');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        msg.className = 'msg';
        btn.disabled = true;
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        btn.disabled = false;
        if (error) {
          msg.textContent = '登录失败：' + error.message;
          msg.className = 'msg err';
          return;
        }
        msg.textContent = '登录成功，正在跳转…';
        msg.className = 'msg ok';
        setTimeout(() => { window.location.href = '/'; }, 800);
      });
    </script>
  </body>
</html>
