<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d0f" />
    <title>登录 · 灵熵 Qi</title>
    <link rel="stylesheet" href="/css/community.css" />
    <style>
      main.auth{width:min(26rem,calc(100% - 3rem));margin:0 auto;min-height:calc(100vh - 4rem);display:grid;align-content:center;gap:1.6rem;padding:2rem 0}
      main.auth h1{margin:0;font-family:Georgia,"Times New Roman","Noto Serif SC",serif;font-weight:400;font-size:2.2rem}
      .switch{font-size:.85rem;color:var(--muted)}
      .switch a{color:var(--text)}
      .step{display:grid;gap:.9rem}
      .hint{font-size:.8rem;color:var(--muted)}
    </style>
  </head>
  <body>
    <nav class="topnav"><div class="topnav-inner">
      <a class="topnav-brand" href="/">灵熵 · Qi</a>
      <div class="topnav-links">
        <a href="/manifesto/">宣言</a><a href="/journal/">手记</a><a href="/board/">留言板</a><a href="/resources/">资源交换</a>
      </div>
      <div class="topnav-auth" id="authState">加载中…</div>
    </div></nav>
    <main class="auth">
      <h1>登录</h1>
      <p class="lead" style="font-size:.9rem;color:var(--muted);margin:0">用邮箱验证码登录，不用记密码。</p>

      <form class="community-form step" id="step1Form">
        <div>
          <label class="hint" for="email">邮箱</label>
          <input id="email" name="email" type="email" required />
        </div>
        <button type="submit" id="step1Btn">发送验证码</button>
        <p class="msg" id="step1Msg"></p>
      </form>

      <form class="community-form step" id="step2Form" style="display:none">
        <p class="hint">验证码已发送到邮箱，5-10分钟内有效。</p>
        <div>
          <label class="hint" for="code">6位验证码</label>
          <input id="code" name="code" type="text" inputmode="numeric" required maxlength="8" />
        </div>
        <button type="submit" id="step2Btn">验证并登录</button>
        <p class="msg" id="step2Msg"></p>
      </form>

      <p class="switch">还没有账号？<a href="/signup/">去注册</a></p>
    </main>
    <script type="module">
      import { supabase } from '/js/supabase-client.js';
      import { renderAuthState } from '/js/community.js';
      renderAuthState('authState');

      let pendingEmail = '';
      const step1Form = document.getElementById('step1Form');
      const step2Form = document.getElementById('step2Form');
      const step1Msg = document.getElementById('step1Msg');
      const step2Msg = document.getElementById('step2Msg');

      step1Form.addEventListener('submit', async (e) => {
        e.preventDefault();
        step1Msg.textContent = ''; step1Msg.className = 'msg';
        const btn = document.getElementById('step1Btn');
        btn.disabled = true;
        const email = document.getElementById('email').value.trim();
        const { error } = await supabase.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
        btn.disabled = false;
        if (error) {
          step1Msg.textContent = '发送失败：' + error.message + '（如果还没注册过，请先去加入社区）';
          step1Msg.className = 'msg err';
          return;
        }
        pendingEmail = email;
        step1Msg.textContent = '验证码已发送，请查收邮箱。';
        step1Msg.className = 'msg ok';
        step2Form.style.display = 'grid';
      });

      step2Form.addEventListener('submit', async (e) => {
        e.preventDefault();
        step2Msg.textContent = ''; step2Msg.className = 'msg';
        const btn = document.getElementById('step2Btn');
        btn.disabled = true;
        const code = document.getElementById('code').value.trim();
        const { error } = await supabase.auth.verifyOtp({ email: pendingEmail, token: code, type: 'email' });
        btn.disabled = false;
        if (error) {
          step2Msg.textContent = '验证失败：' + error.message;
          step2Msg.className = 'msg err';
          return;
        }
        step2Msg.textContent = '登录成功，正在跳转…';
        step2Msg.className = 'msg ok';
        setTimeout(() => { window.location.href = '/'; }, 800);
      });
    </script>
  </body>
</html>
