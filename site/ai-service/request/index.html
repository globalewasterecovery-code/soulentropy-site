<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d0f"><title>提交技术需求 · 灵熵炁</title><meta name="description" content="注册用户的软件安装、故障修复与自动化开发服务。先明确问题与验收，再确认报价。"><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://soulentropy.org/ai-service/request/"><link rel="stylesheet" href="/css/community.css"><link rel="stylesheet" href="/css/ai-service.css"></head><body>
<nav class="topnav"><div class="topnav-inner"><a class="topnav-brand" href="/">灵熵 · Qi</a><div class="topnav-links"><a href="/ai-service/" aria-current="page">AI 技术服务</a><a href="/events/">社区</a><a href="/contact/">联系</a></div><div id="authState" class="topnav-auth">正在连接…</div></div></nav>
<main class="service-wrap"><p class="eyebrow">MEMBER SERVICE DESK</p><h1>提交技术需求</h1><p class="lead">详细填写环境、问题和验收目标，便于评估。<a href="/ai-service/">查看服务介绍 →</a></p><section class="service-section" id="request"><p class="eyebrow">03 / 开始解决</p><h2>告诉我们，你卡在哪里。</h2><div id="loginGate" class="gate"><p>注册并登录后，即可提交私密需求、查看报价和进度。</p><a class="btn-primary" href="/signup/">注册账号</a> <a class="btn-secondary" href="/login/">已有账号，登录</a></div>
<form id="requestForm" class="community-form" hidden><label>问题标题<input name="title" required minlength="3" maxlength="120" placeholder="例如：安装 Python 工具后启动报错"></label><div class="form-grid"><label>服务类型<select name="service"><option value="installation">安装与环境配置</option><option value="repair">软件故障与代码修复</option><option value="automation">工作流自动化</option><option value="development">开发、接口与迁移</option><option value="authorized_security">授权安全测试与修复</option><option value="industrial">固件、PLC/HMI与板卡诊断</option></select></label><label>系统与软件环境<input name="environment" required minlength="2" maxlength="1000" placeholder="操作系统、软件版本、设备"></label></div><label>具体问题与已尝试的办法<textarea name="description" required minlength="20" maxlength="6000" rows="5" placeholder="出现了什么、报错原文、如何复现、已经试过什么。请先删去密码、密钥和客户隐私。"></textarea></label><label>怎样才算解决？<textarea name="acceptance" required minlength="5" maxlength="2000" rows="2" placeholder="例如：能在指定电脑启动，并成功处理一份样例文件。"></textarea></label><div class="form-grid"><label>预算上限（可留空）<input name="budget" type="number" min="0" max="9999999999" step="0.01" placeholder="尚未确定可留空"></label><label>预算币种<select name="currency"><option>USD</option><option>VND</option><option>CNY</option><option>USDT</option></select></label></div><label class="check"><input type="checkbox" name="authorization" required>我拥有相关软件、设备或系统的权利，或已取得本次协助所需授权；安全测试前另行核实目标与范围。</label><label class="check"><input type="checkbox" name="consent" required>同意负责人查看本需求并用于评估和联系。涉及第三方 AI 的资料转交，须先确认资料范围；本次不授予远程控制权限。</label><button id="submitRequest">提交私密需求</button><p class="msg" id="requestMsg" role="status" aria-live="polite"></p></form><p class="small">不要提交密码、支付密钥或完整生产数据。需求不会公开展示；本站负责人可查看。提交不代表已承接或保证解决。</p></section>
<section class="service-section" id="orders"><p class="eyebrow">04 / 每一步都看得见</p><h2>我的需求与进度</h2><button class="btn-secondary" id="refreshOrders" type="button">刷新进度</button><div id="orderList" class="post-list" aria-live="polite">登录后查看你的需求。</div></section><footer><a href="/">← 返回灵熵炁</a><span>从问题出发，以验收为准。</span></footer></main><script type="module" src="/js/ai-service.js"></script></body></html>
