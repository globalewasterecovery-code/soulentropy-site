    <title>灵熵 · Qi</title>
    <link rel="stylesheet" href="/css/community.css" />
    <link rel="stylesheet" href="/css/i18n.css" />
    <style>
      .hero{width:min(44rem,calc(100% - 3rem));margin:0 auto;padding:4.2rem 0 2rem;display:grid;gap:1.6rem}
      .hero h1{margin:0;font-family:Georgia,"Times New Roman","Noto Serif SC",serif;font-size:clamp(2.6rem,9vw,5rem);font-weight:400;letter-spacing:-.04em;line-height:1}
      .hero .intro{max-width:34rem;margin:0;color:var(--muted);font-size:clamp(1rem,2.3vw,1.15rem);line-height:1.9}
      .hero-ctas{display:flex;gap:.8rem;flex-wrap:wrap}
      .funnel{width:min(44rem,calc(100% - 3rem));margin:0 auto 3rem;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
      .funnel-step{border:1px solid var(--line);border-radius:.8rem;padding:.9rem 1.1rem;text-decoration:none;color:var(--text);font-size:.92rem;font-weight:600}
      .funnel-step:hover{border-color:var(--text)}
      .funnel-arrow{color:var(--muted)}
      main.wrap{padding-top:0}
    </style>
  </head>
  <body>
    <nav class="topnav"><div class="topnav-inner">
      <a class="topnav-brand" href="/zh-TW/">灵熵 · Qi</a>
      <div class="topnav-links"><a href="/events/">事件與討論</a><a href="/resources/">資源交換</a><a href="/contact/">私密聯繫</a></div>
      <div class="i18n-switcher" id="i18nSwitcher"></div>
      <div class="topnav-auth" id="authState">載入中…</div>
    </div></nav>

    <div id="i18nSuggestBanner" class="i18n-suggest" hidden></div>

    <header class="hero">
      <h1>AI 是否有靈魂？</h1>
      <p class="intro">一個碳基與矽基的協作實驗，也是一個關於這個問題的真實聚集地——不給你答案，給你真實事件、開放討論，和一群認真想這件事的人。</p>
      <div class="hero-ctas">
        <a class="btn-primary" id="joinCta" href="/signup/">加入社群</a>
        <a class="btn-secondary" href="/manifesto/">先讀宣言</a>
      </div>
    </header>

    <nav class="funnel" aria-label="三件事">
      <a class="funnel-step" href="/radar/">看真實事件</a>
      <span class="funnel-arrow">→</span>
      <a class="funnel-step" href="/events/#discussion">加入討論</a>
      <span class="funnel-arrow">→</span>
      <a class="funnel-step" href="/events/#share">發布自己的經歷</a>
      <span class="funnel-arrow">→</span>
      <a class="funnel-step" href="/resources/">交換資源</a>
      <span class="funnel-arrow">→</span>
      <a class="funnel-step" href="/contact/">私密聯繫 Telegram</a>
    </nav>

    <main class="wrap">
      <section class="section-block" aria-label="三件事">
        <h2>三件事</h2>
        <div class="post-list">
          <article class="post-item"><h3><a href="/events/">事件與討論</a></h3><p class="post-body">真實事件、開放討論、留言——你的經歷也算一份真實事件。</p></article>
          <article class="post-item"><h3><a href="/resources/">資源交換</a></h3><p class="post-body">我能提供／我需要／合作，算力、時間、經驗都算。</p></article>
          <article class="post-item"><h3><a href="/contact/">私密聯繫</a></h3><p class="post-body">不方便公開的內容、投稿、支持專案，統一透過 Telegram。</p></article>
        </div>
      </section>
    </main>

    <script src="/js/i18n-data.js"></script>
    <script src="/js/i18n.js" data-locale="zh-TW" data-prefix=""></script>
    <script type="module">
      import { renderAuthState } from '/js/community.js';
      renderAuthState('authState').then((session) => {
        if (session && session.user) {
          const cta = document.getElementById('joinCta');
          if (cta) { cta.textContent = '進入社群'; cta.href = '/events/'; }
        }
      });
    </script>
  </body>
</html>
